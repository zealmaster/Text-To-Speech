<!DOCTYPE html>
<HTML>

<head>
    <title>wakamwo</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="container">
        <div class="headtext">wakamwo</div>
        <div class="subtext">A text to speech converter</div>
        <div
  class="file-drop-zone"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  [class.drag-over]="isDragOver"
>
  <input
    type="file"
    id="upload"
    accept=".txt,.pdf,.docx,.doc"
    class="file-input"
    (change)="onFileSelected($event)"
  />

  <label for="upload" class="file-drop-content">
    <span class="upload-icon">📄</span>

    <span class="upload-title">
      Drag & drop your file here
    </span>

    <span class="upload-subtext">
      or <strong>click to browse</strong>
    </span>

    <span class="file-types">
      Supported formats: PDF, DOC, DOCX, TXT
    </span>

    <span class="browse-file-mobile">Browse file</span>
  </label>
</div>
        <div>
            <form class="mainForm" enctype="multipart/form-data">
                <div class="control-buttons">
                    <button onclick="play()" type="button" class="button" title="Play">
                        <i class="fa-solid fa-play"></i>
                    </button>

                    <button onclick="pausePlay()" type="button" class="button" title="Pause">
                        <i class="fa-solid fa-pause"></i>
                    </button>

                    <button onclick="resumePlay()" type="button" class="button" title="Resume">
                      <i class="fa-solid fa-circle-play"></i>
                    </button>

                    <button onclick="stopPlay()" type="button" class="button" title="Stop">
                        <i class="fa-solid fa-stop"></i>
                    </button>
                </div>

                <!-- Active Button -->
                <div id="active-button"></div>
                
                <div>
                    <textarea id="message" type="text" class="formFields" rows=50 placeholder="Type text here..."></textarea><br>
                </div>
            </form>
            <pre id="outputBox"></pre>

        </div>
        <div class="beforeFooter"></div>
    </div>
    <div class="footer">
        <div class="icon"><a href="mailto:onahkingsleyijuo@gmail.com" target="mailto:onahkingsleyijuo@gmail.com"><img
                    src="gmail-icon-logo-svgrepo-com.svg" class="image"></a></div>
        <p>&copy; 2023 - <script>document.write(new Date().getFullYear());</script> wakamwo. All rights reserved.</p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="./index.js"></script>
</body>

</HTML>
